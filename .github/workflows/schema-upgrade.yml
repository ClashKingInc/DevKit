name: Verify schema upgrade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/schema-upgrade.yml
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Build every migration entry point
        run: bash scripts/verify-migration-builds.sh
      - name: Apply published baseline then verify the release upgrade
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/schema-smoke.sh
      - name: Verify a clean full schema and repeat migration
        run: bash scripts/with-test-timescale.sh --profile retained-api -- bash scripts/schema-smoke.sh
      - name: Convert legacy donation-log records
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/donation-log-migration-smoke.sh
      - name: Import legacy donation destinations into autoboards
        run: bash scripts/with-test-timescale.sh --profile retained-api -- bash scripts/donation-log-import-smoke.sh
      - name: Backfill recorded Legend streaks
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/legend-streak-migration-smoke.sh
      - name: Verify roster player-label upgrade and rollback
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/roster-member-groups-smoke.sh
      - name: Verify roster role refresh inputs
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/roster-role-refresh-smoke.sh
      - name: Verify clan member warning settings
        run: bash scripts/with-test-timescale.sh --profile baseline-021 -- bash scripts/clan-member-warning-smoke.sh
