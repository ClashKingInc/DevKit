name: Validate developer kit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-and-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ClashKingApp for design drift check
        uses: actions/checkout@v4
        with:
          repository: ClashKingInc/ClashKingApp
          path: clashking-app-drift-check

      - uses: actions/setup-go@v5
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Validate repository
        run: scripts/validate-repository.sh

  pgsync-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: database/go.mod
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Build pinned PGSync with reviewed catch-up patch
        run: docker build -t clashking/pgsync:single-pass-local database/pgsync
      - name: Verify real database, cache, search and PGSync recovery
        env:
          CLASHKING_FIXTURE_LOGICAL_WAL: "1"
        run: bash scripts/with-test-integration.sh --profile retained-api -- python3 scripts/pgsync-service-smoke.py
