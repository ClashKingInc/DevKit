name: Verify Go search handoff
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - run: docker build -t clashking/pgsync:column-filter-local database/pgsync
      - run: docker build -t clashking/searchsync:local -f database/searchsync/Dockerfile .
      - name: Verify existing-index handoff and durable failure recovery
        env:
          CLASHKING_FIXTURE_LOGICAL_WAL: "1"
        run: bash scripts/with-test-integration.sh --profile retained-api -- python3 scripts/search-sync-handoff-smoke.py
