name: Apply production schema

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA to apply
        required: true
        type: string
      confirmation:
        description: Type apply-006-to-007 after reviewing backup and upgrade evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devkit-production-schema
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'ClashKingInc/DevKit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require existing protected production environment
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_POLICY_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = apply-006-to-007
          python3 scripts/check-production-environment.py

  migrate:
    needs: preflight
    environment: production
    # Dedicated ephemeral runner in the DB's private network. Never use this
    # runner group for PRs; restrict it to this workflow on main at org level.
    runs-on:
      group: production-migrations
      labels: [self-hosted, linux, x64, devkit-production-db]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck protection and commit after approval
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_POLICY_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/check-production-environment.py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: database/go.mod
          cache: false
      - name: Install pinned Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Apply only the reviewed 006 to 007 upgrade
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/apply-production-migrations.sh
