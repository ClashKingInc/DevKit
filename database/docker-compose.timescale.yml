name: clashking_tracking

services:
  timescale:
    image: timescale/timescaledb:2.29.2-pg18@sha256:9508616d5b941ed931198504c5db3fb47e8f53f790732ea1e889591f1062057c
    container_name: clashking-tracking-timescale
    restart: unless-stopped
    shm_size: 4gb
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
      - -c
      - max_slot_wal_keep_size=20GB
    environment:
      POSTGRES_DB: ${TIMESCALE_DATABASE}
      POSTGRES_USER: ${TIMESCALE_USERNAME}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
    ports:
      - "${HOST_BIND_IP}:${TIMESCALE_PORT}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescale-data:
